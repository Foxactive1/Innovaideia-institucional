{% extends 'base.html' %}

{% block title %}Erro interno{% endblock %}

{% block content %}
<section class="inv-section inv-error-section">
    <div class="container">
        <span class="inv-eyebrow-sm">Erro 500</span>
        <h1>Algo deu errado</h1>
        <p class="inv-sub">Estamos trabalhando para resolver o problema. Tente novamente mais tarde.</p>
        <div class="inv-hero-btns">
            <a href="{{ url_for('index') }}" class="inv-btn inv-btn-primary">Voltar para a home</a>
            <a href="{{ url_for('contato') }}" class="inv-btn inv-btn-outline">Reportar o problema</a>
        </div>
    </div>
</section>
{% endblock %}
