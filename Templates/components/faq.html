<section class="inv-section" aria-labelledby="faqTitle">
    <div class="container">
        <span class="inv-eyebrow-sm">Folha 11 — FAQ</span>
        <h2 id="faqTitle">Perguntas frequentes</h2>
        <div class="inv-accordion accordion" id="invFAQ">
            {% for item in faq %}
            <div class="accordion-item">
                <h3 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ loop.index }}">
                        {{ item.pergunta }}
                    </button>
                </h3>
                <div id="faq{{ loop.index }}" class="accordion-collapse collapse" data-bs-parent="#invFAQ">
                    <div class="accordion-body">{{ item.resposta }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
