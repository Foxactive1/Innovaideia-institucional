<div class="row g-4">
    <div class="col-lg-7">
        <form class="inv-form" id="invContactForm" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="invNome" class="form-label">Nome *</label>
                    <input type="text" class="form-control" id="invNome" name="nome" required placeholder="Seu nome completo">
                </div>
                <div class="col-md-6">
                    <label for="invEmpresa" class="form-label">Empresa</label>
                    <input type="text" class="form-control" id="invEmpresa" name="empresa" placeholder="Nome da empresa (opcional)">
                </div>
                <div class="col-md-6">
                    <label for="invTelefone" class="form-label">Telefone *</label>
                    <input type="tel" class="form-control" id="invTelefone" name="telefone" required placeholder="(16) 99999-9999">
                </div>
                <div class="col-md-6">
                    <label for="invEmail" class="form-label">E-mail *</label>
                    <input type="email" class="form-control" id="invEmail" name="email" required placeholder="seu@email.com">
                </div>
                <div class="col-12">
                    <label for="invServico" class="form-label">Serviço de interesse</label>
                    <select class="form-control" id="invServico" name="servico">
                        <option value="">Selecione...</option>
                        <option value="Desenvolvimento Full Stack">Desenvolvimento Full Stack</option>
                        <option value="Inteligência Artificial">Inteligência Artificial</option>
                        <option value="Consultoria">Consultoria & Treinamento</option>
                        <option value="APIs & Cloud">APIs & Cloud</option>
                        <option value="Banco de Dados">Banco de Dados</option>
                        <option value="Automação">Automação</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="invMensagem" class="form-label">Mensagem *</label>
                    <textarea class="form-control" id="invMensagem" name="mensagem" required placeholder="Descreva seu projeto ou necessidade..."></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="inv-btn-submit">Enviar mensagem</button>
                </div>
            </div>
            <div class="inv-form-feedback" id="invFormFeedback"></div>
        </form>
    </div>
    <div class="col-lg-5">
        <div class="inv-card-serv" style="clip-path:none;padding:30px;height:100%;">
            <h3><i class="fa-solid fa-map-pin inv-card-icon" style="font-size:22px;"></i> Nossos dados</h3>
            <p style="color:var(--steel);font-size:14px;line-height:2;">
                <strong style="color:var(--amber);">Endereço:</strong><br>Rua Vergílio José Gomes, 2652<br>Franca — SP, Brasil<br><br>
                <strong style="color:var(--amber);">E-mail:</strong><br>innovaideia2023@gmail.com<br><br>
                <strong style="color:var(--amber);">Telefone:</strong><br>(16) 99311-7529<br><br>
                <strong style="color:var(--amber);">GitHub:</strong><br>github.com/Foxactive1
            </p>
        </div>
    </div>
</div>
