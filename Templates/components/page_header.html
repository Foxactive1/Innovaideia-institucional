{# 
  Uso: {% with titulo='Serviços' %}{% include 'components/page_header.html' %}{% endwith %}
  Gera o único <h1> da página + breadcrumb, mantendo o <h2> do componente interno como subtítulo.
#}
<section class="inv-page-header">
    <div class="container">
        <nav class="inv-breadcrumb" aria-label="Breadcrumb">
            <a href="{{ url_for('index') }}">Home</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">{{ titulo }}</span>
        </nav>
        <h1>{{ titulo }}</h1>
    </div>
</section>
