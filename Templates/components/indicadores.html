<section class="inv-section" aria-labelledby="indTitle">
    <div class="container">
        <span class="inv-eyebrow-sm">Folha 02 — Indicadores</span>
        <h2 id="indTitle">Números que falam</h2>
        <p class="inv-sub">Resultados construídos ao longo de mais de uma década de atuação.</p>
        <div class="inv-indicators-grid">
            {% for item in indicadores %}
            <div class="inv-indicator inv-animate-on-scroll">
                <span class="inv-num" data-count="{{ item.numero }}">0</span>
                <span class="inv-label">{{ item.label }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
