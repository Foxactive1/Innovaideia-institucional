<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="InNovaIdeia Assessoria em Tecnologia — Consultoria, desenvolvimento full stack e inteligência artificial aplicada.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://innovaideia.com.br/">
    <title>{% block title %}InNovaIdeia — Assessoria em Tecnologia{% endblock %}</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230E1F3C'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='18' fill='%23E8A33D' font-weight='bold'>IN</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap + Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Loader -->
    <div id="inv-loader"><div class="inv-loader-ring"></div></div>

    <!-- Navbar -->
    {% include 'components/navbar.html' %}

    <!-- Conteúdo principal -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'components/footer.html' %}

    <!-- WhatsApp Float -->
    <a href="https://wa.me/5516993117529" class="inv-whatsapp-float" target="_blank" rel="noopener" aria-label="Fale pelo WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Back to Top -->
    <a href="#home" class="inv-back-top" id="invBackTop" aria-label="Voltar ao topo">
        <i class="fa-solid fa-chevron-up"></i>
    </a>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/contact.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
