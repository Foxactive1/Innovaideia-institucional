<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 
        SEO 1: Meta description mais rica e com palavra-chave no início 
        Tamanho ideal: 150-160 caracteres 
    -->
    <meta name="description" content="{% block meta_description %}InNovaIdeia: assessoria em tecnologia e desenvolvimento full stack. Criamos soluções web, mobile e inteligência artificial para acelerar o seu negócio.{% endblock %}">
    
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.url_root if request else 'https://innovaideia.com.br/' }}">
    
    <!-- SEO 2: Título mais descritivo, incluindo principais serviços -->
    <title>{% block title %}InNovaIdeia — Assessoria em Tecnologia, Desenvolvimento Full Stack e IA{% endblock %}</title>

    <!-- SEO 3: Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:locale" content="pt_BR">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.meta_description() }}">
    <meta property="og:url" content="{{ request.url if request else 'https://innovaideia.com.br/' }}">
    <meta property="og:site_name" content="InNovaIdeia">
    <meta property="og:image" content="https://innovaideia.com.br/static/img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- SEO 4: Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.title() }}">
    <meta name="twitter:description" content="{{ self.meta_description() }}">
    <meta name="twitter:image" content="https://innovaideia.com.br/static/img/og-image.jpg">

    <!-- Favicon (mantido o SVG inline, ótimo para performance) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230E1F3C'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='18' fill='%23E8A33D' font-weight='bold'>IN</text></svg>">
    
    <!-- Google Fonts com preconnect (já estava bom) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap + Font Awesome: adicionado integrity e crossorigin para segurança -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- SEO 5: Dados estruturados JSON-LD (Organization) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "InNovaIdeia",
        "url": "https://innovaideia.com.br",
        "logo": "https://innovaideia.com.br/static/img/logo.png",
        "description": "Assessoria em tecnologia, desenvolvimento full stack e inteligência artificial aplicada.",
        "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+55 16 99311-7529",
            "contactType": "sales",
            "areaServed": "BR",
            "availableLanguage": "Portuguese"
        },
        "sameAs": [
            "https://www.linkedin.com/company/innovaideia",
            "https://www.instagram.com/innovaideia"
        ]
    }
    </script>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- 
        SEO 6: Loader otimizado para não bloquear a renderização 
        Agora ele some em no máximo 1.5s e libera o conteúdo para o LCP 
    -->
    <div id="inv-loader" aria-hidden="true"><div class="inv-loader-ring"></div></div>

    <!-- Navbar -->
    {% include 'components/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'components/footer.html' %}

    <!-- WhatsApp Float com rel="nofollow" para não passar link juice -->
    <a href="https://wa.me/5516993117529" class="inv-whatsapp-float" target="_blank" rel="nofollow noopener" aria-label="Fale pelo WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Back to Top -->
    <a href="#home" class="inv-back-top" id="invBackTop" aria-label="Voltar ao topo">
        <i class="fa-solid fa-chevron-up"></i>
    </a>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/contact.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
