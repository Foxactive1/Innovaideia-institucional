{% extends 'base.html' %}

{% block title %}Página não encontrada{% endblock %}

{% block content %}
<section class="inv-section inv-error-section">
    <div class="container">
        <span class="inv-eyebrow-sm">Erro 404</span>
        <h1>Página não encontrada</h1>
        <p class="inv-sub">O conteúdo que você procura não está disponível ou foi movido.</p>
        <div class="inv-hero-btns">
            <a href="{{ url_for('index') }}" class="inv-btn inv-btn-primary">Voltar para a home</a>
            <a href="{{ url_for('contato') }}" class="inv-btn inv-btn-outline">Falar com a gente</a>
        </div>
    </div>
</section>
{% endblock %}
